<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover och gradient</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(to bottom, red, blue);
            height: 300px;
        }

        main {
            height: 300px;

            background: radial-gradient(circle, red, blue);
        }
    </style>
</head>

<body>
    <header></header>
    <main></main>
</body>

</html>
