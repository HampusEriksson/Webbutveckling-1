<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            background-color: bisque;
            border: dotted 5px green;
            padding: 20px;
        }

        div{
            background-color: red;
            padding: 20px;
        }

        .p1, .p2{
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
        }
        .p2{
            font-weight: bold;
        }

        .flex{
            display: flex;
        }

        .justifycenter{
            justify-content: center;
        }

        .bgcolorblue{
            background-color: blue;
        }

        .bgcoloryellow{
            background-color: yellow;
        }
    </style>
</head>

<body>
    <div class="flex justifycenter bgcolorblue bgcoloryellow">
        <p class="p1">Lorem, ipsum.</p>
        <p class="p2">Lorem, ipsum.</p>
        <p>Lorem, ipsum.</p>
    </div>
    <div>
        <p>Lorem, ipsum.</p>
        <p class="bgcolorblue">Lorem, ipsum.</p>
        <p>Lorem, ipsum.</p>
    </div>
    <div class="flex">
        <p>Lorem, ipsum.</p>
        <p>Lorem, ipsum.</p>
        <p>Lorem, ipsum.</p>
    </div>

</body>

</html>
