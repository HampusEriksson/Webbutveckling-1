<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .flexbox div {
            background-color: aqua;
            border: 2px solid black;
            width: 150px;
            height: 50px;
        }

        .flexbox {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            align-items:center;
        }

        header {
            background-color: yellow;
        }

        footer {
            background-color: blueviolet;
        }

        main {
            flex-grow: 1;

        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: burlywood;
        }
    </style>
</head>

<body>

    <header>
        <h1>Välkommen</h1>
    </header>
    <main class="flexbox">

        <div>
            <p>Box 1</p>
        </div>
        <div>
            <p>Box 2</p>
        </div>
        <div>
            <p>Box 3</p>
        </div>
        <div>
            <p>Box 3</p>
        </div>
        <div>
            <p>Box 3</p>
        </div>
    </main>

    <footer>
        <h2>Kontaktuppgifter</h2>
    </footer>
</body>

</html>
