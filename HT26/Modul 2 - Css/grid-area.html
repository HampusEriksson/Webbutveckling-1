<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Areas Exempel</title>
    <style>
        /* Nollställ marginaler och sätt typsnitt */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .layout {
            display: grid;

            grid-template-columns: 200px 1fr;

            grid-template-rows: auto 300px auto;

            grid-template-areas:
                "header  header"
                "sidebar content"
                "footer  footer";

            gap: 15px;
        }

        .header {
            grid-area: header;
        }

        .sidebar {
            grid-area: sidebar;
        }

        .content {
            grid-area: content;
        }

        .footer {
            grid-area: footer;
        }

        .layout * {
            padding: 20px;
            border-radius: 8px;
            background-color: #2c3e50;
            color: white;
        }
    </style>
</head>

<body>

    <div class="layout">
        <header class="header">Header</header>
        <aside class="sidebar">Sidebar (200px)</aside>
        <main class="content">Huvudinnehåll (1fr)</main>
        <footer class="footer">Footer</footer>
    </div>

</body>

</html>
