<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Areas Exempel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: auto 300px auto;
            grid-template-areas:
                "header  header"
                "sidebar content"
                "footer  footer";
            gap: 15px;
        }

        header {
            grid-area: header;
        }

        aside {
            grid-area: sidebar;
        }

        main {
            grid-area: content;
        }

        footer {
            grid-area: footer;
        }

        body * {
            padding: 20px;
            border-radius: 8px;
            background-color: #2c3e50;
            color: white;
        }
    </style>
</head>

<body class="layout">
    <header>Header</header>
    <aside>Sidebar</aside>
    <main>Huvudinnehåll</main>
    <footer>Footer</footer>

</body>

</html>
