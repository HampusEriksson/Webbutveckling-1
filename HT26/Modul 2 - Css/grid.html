<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

body{
    height: 100vh;
    display: grid;
    grid-template-columns: 6fr 4fr;
    grid-template-rows: 1fr 5fr 1fr 3fr 100px;
}

header, section{
    border: 3px solid;
    background-color: lightblue;
}

.col2{
    grid-column: span 2;
}

.row2{
    grid-row: span 2;
}
div{
    border: 2px solid red;
}
    </style>
</head>

<body>

    <header class="col2">Header</header>
    <section class="row2">Section 1</section>
    <section>Section 2</section>
    <section>
        <div>div 1</div>
        <div>div 2</div>
    </section>
    <section class="col2">Section 3</section>
    <section>Section 4</section>
    <section>Section 5</section>

</body>

</html>
