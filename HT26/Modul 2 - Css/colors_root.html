<!DOCTYPE html>
<html lang="sv">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CSS-färger och :root</title>
<link rel="stylesheet" href="colors_root.css">
</head>
<body>
	<h1>Olika sätt att skriva färger i CSS</h1>
	<p>Exempel på färgklasser och CSS-variabler från den tillhörande CSS-filen.</p>

	<div class="examples">
		<div class="rgba">RGBA</div>
		<div class="primary">Primär färg</div>
		<div class="secondary">Sekundär färg<</div>
		<div class="accent">Accentfärg</div>
		<div class="hex">Hexfärg</div>
		<div class="named">Namngiven färg</div>
	</div>

	<h2>Exempel med :root och CSS-variabler</h2>
	<p><code>:root</code> väljer dokumentets rotelement. Variablerna kan återanvändas med <code>var()</code>.</p>
</body>
