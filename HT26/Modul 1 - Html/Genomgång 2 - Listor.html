<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listor</title>
</head>

<body>

    <!--ol = ordered list-->
    <ol>
        <li>Webbutveckling</li>
        <li>Programmering</li>
        <li>Matte</li>
    </ol>

    <!--ul = unordered list-->
    <ul>
        <li>Handla mat</li>
        <li>Jobba</li>
        <li>Sova</li>
    </ul>

    <ul>
        <li>Frukt

            <ol>
                <li>Äpple</li>
                <li>Banan</li>
            </ol>
        </li>
        <li>Grönsaker
            <ol>
                <li>Gurka</li>
                <li>Tomat</li>
            </ol>
        </li>
    </ul>

</body>

</html>
