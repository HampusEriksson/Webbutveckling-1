<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listor</title>
</head>

<body>

    <!--ol = ordered list-->
    <ol>
        <li>Webbutveckling</li>
        <li>Programmering</li>
        <li>Matte</li>
    </ol>

    <!--ul = unordered list-->
    <ul>
        <li>Handla mat</li>
        <li>Jobba</li>
        <li>Sova</li>
    </ul>

    <ul>
        <li>Frukt</li>
        <ol>
            <li>Äpple</li>
            <li>Banan</li>
        </ol>

        <li>Grönsaker</li>
        <ol>
            <li>Gurka</li>
            <li>Tomat</li>
        </ol>
    </ul>

</body>

</html>
