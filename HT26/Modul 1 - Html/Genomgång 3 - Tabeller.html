<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabeller och listor</title>
</head>

<body>
    <table border="5" width="70%">
        <thead>
            <tr>
                <th width="60%">Namn</th>
                <th>Klass</th>
            </tr>
        </thead>
        <tbody>

                <td align="center">Hampus</td>
                <td>32</td>
            </tr>

            <tr>
                <td>Pelle</td>
                <td>28</td>
            </tr>
            <tr>
                <td>Anna</td>
                <td>35</td>
            </tr>
        </tbody>
    </table>



</body>

</html>
