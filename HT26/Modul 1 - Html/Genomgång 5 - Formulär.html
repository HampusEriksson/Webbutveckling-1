<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>HTML-formulär</title>
</head>
<body>

<h1>HTML-formulär</h1>

<form action="tack.html" method="get">
<fieldset>
    <legend>Grunduppgifter</legend>
    <!--for attributet i label, ska matcha id i input-->
    <label for="text-input">Namn:</label>
    <input type="text" id="text-input" name="namn" required>
    
    <label for="password-input">Password Input:</label>
    <input placeholder="Enter your password here" type="password" id="password-input" name="password-input">
    
    <label for="number-input">Ålder:</label>
    <input value="24" type="number" id="number-input" name="alder" min="0" max="120">
</fieldset>
<fieldset>
    <legend>Kontaktuppgifter</legend>
    <label for="date-input">Födelsedatum:</label>
    <input type="date" id="date-input" name="date-input">
    
    <label for="email-input">E-post:</label>
    <input type="email" id="email-input" name="email" required>
    
    <label for="url-input">URL Input:</label>
    <input type="url" id="url-input" name="url-input">
</fieldset>
<fieldset>
    <legend>Övriga input-typer</legend>
    <label for="file-input">File Input:</label>
    <input type="file" id="file-input" name="file-input">
    
    <label for="color-input">Color Input:</label>
    <input type="color" id="color-input" name="color-input">
    
    <label for="range-input">Range Input:</label>
    <input type="range" id="range-input" name="range-input" min="0" max="100">
    
    <label for="search-input">Search Input:</label>
    <input type="search" id="search-input" name="search-input">
    
    <label for="tel-input">Telephone Input:</label>
    <input type="tel" id="tel-input" name="tel-input">
    
    
</fieldset>
<fieldset>
    <legend>Val</legend>
    <p>Vilket sätt föredrar du att bli kontaktad?</p>
    <input type="radio" id="kontakt-epost" name="kontakt" value="epost" checked>
    <label for="kontakt-epost">E-post</label>
    <input type="radio" id="kontakt-telefon" name="kontakt" value="telefon">
    <label for="kontakt-telefon">Telefon</label>

    <p>Vilka ämnen är du intresserad av?</p>
    <input type="checkbox" id="html" name="amne" value="html">
    <label for="html">HTML</label>
    <input type="checkbox" id="css" name="amne" value="css">
    <label for="css">CSS</label>
    <input type="checkbox" id="javascript" name="amne" value="javascript">
    <label for="javascript">JavaScript</label>

    <label for="kurs">Välj kurs:</label>
    <select id="kurs" name="kurs">
        <option value="webbutveckling-1">Webbutveckling 1</option>
        <option value="webbutveckling-2">Webbutveckling 2</option>
    </select>
</fieldset>
<fieldset>
    <legend>Meddelande</legend>
    <label for="meddelande">Skriv ett meddelande:</label>
    <textarea id="meddelande" name="meddelande" rows="7" cols="50"></textarea>
</fieldset>
    <button type="submit">Skicka formulär</button>
    <button type="reset">Rensa formulär</button>
</form>

</body>
</html>
