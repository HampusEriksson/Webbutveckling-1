<!--Doctype html  -->
<!DOCTYPE html>
<!--html lang="en" innebär att sidan är skriven på engelska -->
<html lang="en">
<!--head innehåller information om sidan, t.ex. titel, meta-taggar och länkar till CSS-filer -->
<head>
    <!--meta charset="UTF-8" anger teckenkodningen för sidan, vilket gör att specialtecken visas korrekt -->
    <meta charset="UTF-8">
    <!--meta name="viewport" content="width=device-width, initial-scale=1.0" gör att sidan blir responsiv och anpassar sig efter olika skärmstorlekar -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--title anger titeln på sidan som visas i webbläsarens flik -->
    <title>Document</title>
</head>
<!--body innehåller själva innehållet på sidan, t.ex. text, bilder och länkar -->
<body>
    
</body>
</html>
